name: Basic Check

on:
  push:
    branches: ["main"]

jobs:
  check-app:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          GEMINI_API_KEY: "fake-key-for-testing"
          GROQ_API_KEY: "fake-key-for-testing"
          DATABASE_URL: "postgresql+asyncpg://postgres:password@localhost:5432/testdb"
          REDIS_URL: "redis://localhost:6379/0"
        run: python -m pytest

      - name: Deploy to Render
        if: success()
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl -X POST "$deploy_url"
